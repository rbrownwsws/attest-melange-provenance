# $schema: https://json.schemastore.org/github-action.json
name: "Attest melange provenance"
description: "Create attestations for a melange build provenance statement"

inputs:
  statement-file:
    description: "Path to the melange build provenance statement file (N.B. This must be a cleaned-up version. Not directly from melange)"
    required: true
  github-mangled-predicate-type:
    description: "The predicate type to use for the GitHub Attestation (you cannot use 'https://slsa.dev/provenance/v1')"
    default: "https://chainguard.dev/provenance/melange/v1"
  github-api-token:
    description: "The GitHub API token to use to create the Attestation"
    default: ${{ github.token }}

outputs:
  github-mangled-bundle-path:
    description: "The path to the bundle file used for GitHub attestation"
    value: "${{ steps.attest-github.outputs.bundle-path }}"
  slsa-provenance-bundle-path:
    description: "The path to the bundle file with the real SLSA provenance type"
    value: "${{ steps.attest-cosign.outputs.bundle-path }}"

runs:
  using: "composite"

  steps:
    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Extract predicate
      id: extract-predicate
      shell: bash
      env:
        STATEMENT_FILE: ${{ inputs.statement-file }}
      run: |
        set -euo pipefail
        
        SCRIPT="${GITHUB_ACTION_PATH}/extract-predicate.sh"
        chmod +x "${SCRIPT}"
        "${SCRIPT}"

    - name: Attest to GitHub (with mangled predicate type)
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
      id: attest-github
      with:
        subject-name: "${{ steps.extract-predicate.outputs.subject-name }}"
        subject-digest: "${{ steps.extract-predicate.outputs.subject-digest }}"
        predicate-type: "${{ inputs.github-mangled-predicate-type }}"
        predicate-path: "${{ steps.extract-predicate.outputs.predicate-file }}"
        github-token: "${{ inputs.github-api-token }}"

    - name: Attest with cosign directly (with real predicate type)
      id: attest-cosign
      shell: bash
      run: |
        set -euo pipefail
        
        SCRIPT="${GITHUB_ACTION_PATH}/attest-cosign.sh"
        chmod +x "${SCRIPT}"
        "${SCRIPT}"
